<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Lingovia</title>
<meta name="description" content="Apprends une langue en parlant avec ton prof, à ton niveau.">
<meta name="theme-color" content="#fbf7f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  --bg:#fbf7f1; --card:#fff; --ink:#1d2733; --muted:#6b7684; --line:#ece4d8;
  --accent:#f26b1d; --accent-ink:#fff; --accent-soft:#fde9dc;
  --teal:#0f5c5c; --teal-soft:#e2f0ef; --ok:#1f9d6b; --warn:#b4530a; --warn-soft:#fff3e0;
  --r:18px; --shadow:0 6px 24px rgba(60,40,10,.08);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 16px 8px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{color:var(--accent);font-style:normal}
.pair{margin-left:auto;font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:6px 10px;border-radius:99px}
.streak{font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:99px}

/* hero */
.hero{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:14px;align-items:center}
.hero img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 30%;background:#e7ddcb;flex:none;border:3px solid var(--accent-soft)}
.hero small{color:var(--muted);font-weight:600}
.hero h2{font-size:20px;margin:2px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 18px;border-radius:14px;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.teal{background:var(--teal)}
.btn.block{display:flex;width:100%}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.overall{margin:14px 2px 4px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}

/* phases */
.phase{background:var(--card);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.phase header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.phase h3{font-size:17px}
.lvl{font-size:11px;font-weight:800;color:var(--teal);background:var(--teal-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.phase p{margin:2px 0 12px;color:var(--muted);font-size:14px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{aspect-ratio:1;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
.day.done{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
.day.done::after{content:"✓";position:absolute;right:5px;top:2px;font-size:10px}
.day.cur{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(242,107,29,.4)}
.day.lock{opacity:.5}
.les{display:grid;gap:8px;margin-top:10px}
.lrow{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:10px 12px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
.lrow i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--card);color:var(--muted);border:1.5px solid var(--line)}
.lrow b{display:block;font-size:15px}.lrow small{display:block;color:var(--muted);font-size:13px}
.lrow.done i{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.lrow.cur{border-color:var(--accent);background:var(--accent-soft)}.lrow.cur i{background:var(--accent);color:#fff;border-color:var(--accent)}
.free{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:14px 16px;border-radius:var(--r);background:var(--teal);color:#fff;box-shadow:var(--shadow)}
.free .em{font-size:26px}.free b{display:block;font-size:16px}.free small{display:block;opacity:.85;font-size:13px}.free .go{margin-left:auto;font-size:26px;opacity:.8}

/* tab bar */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(6px + var(--safe-b))}
.tabs button{flex:1;padding:8px 4px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
.tabs button.on{color:var(--accent)}
.tabs svg{width:22px;height:22px}

/* lesson */
#lesson{background:#000}
.stage{position:relative;flex:none;height:36dvh;min-height:210px;max-height:340px;background:#1b1b1b;overflow:hidden}
.stage video,.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.stage #face{opacity:0;transition:opacity .18s}
.stage.talking #face{opacity:1}
.stage #vLive{opacity:0;transition:opacity .28s}
.stage.talking.haslive #vLive{opacity:1}
.stage.hastalk #vLive{opacity:0;transition:opacity .16s}
.stage.hastalk.voiced #vLive{opacity:1}
.stage.hastalk #face{display:none}
.stage #vSimli{opacity:0;pointer-events:none;transition:opacity .45s}
.stage.simli #vSimli{opacity:1}
.stage #vReact{opacity:0;transition:opacity .22s;pointer-events:none}
.stage.reacting #vReact{opacity:1}
.stage.vid>img,.stage.vid #vIdle,.stage.vid #vLive,.stage.vid #face,.stage.vid #vReact{object-fit:cover;object-position:50% 16%}
#lesson.call .stage.vid>img,#lesson.call .stage.vid #vIdle,#lesson.call .stage.vid #vLive,#lesson.call .stage.vid #face,#lesson.call .stage.vid #vReact{object-position:50% 30%}
.stage video,.stage>img,.stage #face{transform:scale(1.035)}
.stage #av3d{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,#f7efe2 0%,#e7ddcb 45%,#b9cfc9 100%)}
.stage #av3d canvas{position:absolute;inset:0}
.stage.three #av3d{opacity:1}
.stage.nophoto #vIdle,.stage.nophoto #face{visibility:hidden}
.stage.nophoto>img{object-fit:contain;object-position:50% 40%;transform:none}
.stage.nophoto{background:radial-gradient(120% 90% at 50% 35%,#f7efe2 0%,#e7ddcb 45%,#b9cfc9 100%)}
.stage::after{z-index:1;content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.stage .hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) 12px 0;display:flex;gap:8px;align-items:center;z-index:2}
.pill{background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.stage .who{position:absolute;left:14px;bottom:26px;z-index:2;color:#fff}
.stage .who b{font-size:18px;display:block}
.stage .who span{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#7CFC9A}
.stage.talking .dot{background:var(--accent);animation:pulse 1s infinite}
.stage.thinking .dot{background:#ffd76a;animation:pulse .7s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;margin-top:-16px;position:relative;z-index:3}
#chat{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.msg.her{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.seg+.seg{margin-top:8px}
.seg.t{cursor:pointer}
.seg.t .tx{font-weight:700;font-size:17px;color:var(--ink)}
.seg.t .tr{font-size:14px;color:var(--muted);margin-top:1px}
.seg.t .tr.hid{filter:blur(5px)}
.seg.t .act{display:flex;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--warn);display:inline-flex;align-items:center;gap:5px;min-height:28px}
.chip svg{width:14px;height:14px}
.fix{align-self:stretch;background:var(--warn-soft);border:1.5px solid #ffd9a8;border-radius:16px;padding:12px 14px;animation:in .25s ease}
.fix h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.fix s{color:var(--muted)}
.fix .good{font-weight:700;font-size:16px;margin:2px 0 4px;color:var(--ok)}
.fix p{margin:0;font-size:14px;color:var(--ink)}
.note{align-self:center;font-size:12px;color:var(--muted);background:var(--line);padding:6px 12px;border-radius:99px;text-align:center}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{font-size:19px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ph b{display:block;font-size:16px}
.ph span{font-size:13px;color:var(--muted)}
.ph svg{width:20px;height:20px;color:var(--accent);flex:none;margin-left:auto}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
#sugg{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
#sugg::-webkit-scrollbar{display:none}
#sugg button{flex:none;max-width:78%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px}
#sugg b{display:block;font-size:14px}#sugg span{font-size:12px;color:var(--muted)}
.composer{display:flex;align-items:center;gap:8px;padding:8px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--card)}
.lang{flex:none;width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);font-weight:800;font-size:13px}
.composer input{flex:1;min-width:0;height:44px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:inherit;background:var(--bg);color:var(--ink);outline:none}
.composer input:focus{border-color:var(--accent)}
.mic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(242,107,29,.4)}
.mic svg{width:24px;height:24px}
.mic.live{background:#d92d20;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(217,45,32,.5)}100%{box-shadow:0 0 0 16px rgba(217,45,32,0)}}

.callbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--card)}
.cb{width:52px;height:52px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:800;color:var(--teal)}
.cb svg{width:22px;height:22px}
.cb.off{background:#fde3e1;border-color:#f6b9b4;color:#b42318}
.cb.hang{width:64px;height:64px;background:#d92d20;border-color:#d92d20;color:#fff;box-shadow:0 4px 14px rgba(217,45,32,.4)}
.cb.hang svg{width:28px;height:28px}
.callbar .mid{flex:1;text-align:center;font-size:12px;color:var(--muted);font-weight:700;line-height:1.3}
.callbar .mid b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
/* full screen video call */
#lesson.call .stage{flex:1;height:auto;max-height:none}
#lesson.call .sheet{display:none}
#lesson.call .stage::after{height:46%;background:linear-gradient(transparent,rgba(0,0,0,.72))}
#lesson.call .stage::before{content:"";position:absolute;inset:0 0 auto 0;height:130px;background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:1;pointer-events:none}
#lesson.call #backBtn,#lesson.call #dayPill{display:none}
#lesson.call .hud{justify-content:flex-end}
#lesson.call .who{left:0;right:0;top:calc(14px + var(--safe-t));bottom:auto;text-align:center;pointer-events:none}
#lesson.call .who b{font-size:20px}
#lesson.call .who span{justify-content:center;font-size:13px}
#timer:not(:empty)::before{content:"· "}
.stage.listening .dot{background:#7CFC9A;animation:pulse 1.6s infinite}
.cctl{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:space-evenly;align-items:center;padding:14px 10px calc(18px + var(--safe-b))}
.cctl .cb{width:54px;height:54px;background:rgba(255,255,255,.18);border:0;color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px}
.cctl .cb.off{background:#fff;color:#1d2733}
.cctl .cb.on{background:#fff;color:#1d2733}
.cctl .cb.hang{width:66px;height:66px;background:#e5382b;color:#fff}
.subs{position:absolute;left:14px;right:14px;bottom:calc(108px + var(--safe-b));z-index:3;display:none;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#lesson.call .subs{display:flex}
.subs .line{max-width:100%;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:9px 13px;font-size:16px;line-height:1.35;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:in .2s ease}
.subs .line small{display:block;font-size:13px;opacity:.8;margin-top:3px}
.subs .line.me{background:rgba(15,92,92,.75);font-size:14px;align-self:flex-end}
.subs .tcard{pointer-events:auto;width:100%;background:rgba(255,255,255,.96);color:var(--ink);border-radius:16px;padding:10px 14px;text-align:left;animation:in .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.subs .tcard h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.subs .tcard b{display:block;font-size:17px;color:var(--teal)}
.subs .tcard.fixc b{color:var(--ok)}
.subs .tcard s{color:var(--muted);font-size:14px}
.subs .tcard span{font-size:13px;color:var(--muted)}
.stage video.pip{position:absolute;z-index:5;inset:auto;right:12px;top:calc(70px + var(--safe-t));width:96px;height:132px;border-radius:16px;object-fit:cover;object-position:center;background:#000;transform:scaleX(-1);box-shadow:0 6px 20px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.7);touch-action:none;cursor:grab}
.lost{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.lost>div{background:var(--card);border-radius:20px;padding:20px;max-width:340px;width:100%;text-align:center}
.lost p{color:var(--muted);font-size:14px;margin:6px 0 14px}
/* audio only */
.orb{position:absolute;inset:0;z-index:1;display:none;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 35%,#16424a 0%,#0c2a30 60%,#071a1e 100%)}
#lesson.audio .orb{display:flex}
.orb i{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb27d,#f26b1d 60%,#b8480b);box-shadow:0 0 0 calc(var(--v,0) * 46px) rgba(242,107,29,.18),0 0 60px rgba(242,107,29,.45);transform:scale(calc(1 + var(--v,0) * .18));transition:transform .08s linear,box-shadow .08s linear}
.orb b{position:absolute;color:#fff;font-size:44px;font-weight:800}
.rowsw{display:flex;align-items:center;gap:12px;padding:12px 0 2px;border-top:1px solid var(--line);margin-top:6px}
.rowsw div{flex:1}.rowsw b{display:block;font-size:15px}.rowsw span{font-size:13px;color:var(--muted)}
.msg.her.tap{cursor:pointer}
.msg.her .tr{font-size:14px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.msg.her .hint{font-size:11px;color:var(--muted);margin-top:4px;opacity:.8}
.pc{align-self:flex-start;display:flex;align-items:center;gap:10px;background:var(--teal-soft);border-radius:14px;padding:9px 12px;max-width:88%;animation:in .25s ease;text-align:left}
.pc b{display:block;font-size:16px;color:var(--teal)}.pc span{font-size:13px;color:var(--muted)}
.pc svg{width:18px;height:18px;color:var(--teal);flex:none}
.score{font-size:40px;font-weight:800;color:var(--teal);line-height:1}
.rep h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rep ul{margin:0;padding-left:18px}.rep li{margin:3px 0;font-size:15px}
.rep .fx{border-top:1px solid var(--line);padding:8px 0}.rep .fx s{color:var(--muted);font-size:14px}.rep .fx b{display:block;color:var(--ok)}.rep .fx span{font-size:13px;color:var(--muted)}
/* review + settings */
.flash{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:28px 20px;text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash .q{font-size:20px;font-weight:700}
.flash .a{font-size:24px;font-weight:800;color:var(--teal)}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set div{flex:1}.set b{display:block}.set span{font-size:13px;color:var(--muted)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--accent)}.sw.on::after{left:23px}
input[type=range]{width:120px;accent-color:var(--accent)}
/* onboarding */
#onb{background:var(--bg)}
.obtop{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--safe-t)) 14px 6px}
.obtop button{min-width:40px;height:40px;font-weight:700;color:var(--muted);font-size:14px}
#obBack{font-size:28px;line-height:1}
.obbar{flex:1;display:flex;gap:5px}
.obbar i{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.obbar i b{position:absolute;inset:0;background:var(--accent);border-radius:99px;transform-origin:left;transition:transform .3s}
.obbar i.full b{background:var(--ok)}
#obBody{padding:18px 20px 20px;display:flex;flex-direction:column;align-items:center}
#obBody h1{font-size:27px;text-align:center;margin:8px 0 6px;letter-spacing:-.02em;line-height:1.15}
#obBody .lead{color:var(--muted);text-align:center;margin:0 0 20px;font-size:15px;max-width:340px}
.opts{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:14px 16px;font-weight:600;font-size:16px;box-shadow:0 2px 10px rgba(60,40,10,.05)}
.opt .em{font-size:24px;width:30px;text-align:center;flex:none}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.obin{width:100%;max-width:380px;height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 16px;font:inherit;font-size:19px;font-weight:600;color:var(--ink);outline:none;margin-bottom:18px;text-align:center}
.obin:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:400px}
.wchip{padding:10px 15px;border-radius:99px;background:var(--card);font-weight:600;font-size:15px;box-shadow:0 2px 8px rgba(60,40,10,.05)}
.wchip.sel{background:var(--ok);color:#fff}
.obfoot{padding:8px 20px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:center}
.obfoot:empty{display:none}
.obfoot .btn{width:100%;max-width:380px;min-height:54px;border-radius:99px;font-size:16px}
.obfoot .btn[disabled]{opacity:.4}
.obfoot label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted);padding:4px}
.obinfo{background:linear-gradient(180deg,var(--accent-soft),transparent);border-radius:24px;padding:22px 18px;width:100%;max-width:380px;text-align:center}
.obinfo p{margin:0;font-size:16px;line-height:1.45}
.faces{display:flex;justify-content:center;margin:18px 0 4px}
.faces img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);margin-left:-14px;background:#e7ddcb}
.faces img:first-child{margin-left:0}
.tcardb{width:100%;max-width:340px;border-radius:26px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);position:relative}
.tcardb img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e7ddcb}
.tcardb .inf{padding:14px 16px 16px}
.tcardb h3{font-size:22px}
.tcardb p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
.play{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:7px 12px;min-height:34px}
.play svg{width:15px;height:15px}
.trow{display:flex;gap:12px;align-items:center;width:100%;max-width:400px;background:var(--card);border:2px solid transparent;border-radius:20px;padding:10px;text-align:left;box-shadow:0 2px 10px rgba(60,40,10,.05)}
.trow.sel{border-color:var(--accent)}
.trow img{width:78px;height:78px;border-radius:16px;object-fit:cover;flex:none;background:#e7ddcb}
.trow b{font-size:17px;display:block}.trow small{color:var(--muted);font-size:13px;display:block;margin:1px 0 6px}
.sum{width:100%;max-width:380px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:6px 16px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.sum div:first-child{border-top:0}.sum span{color:var(--muted)}.sum b{text-align:right}
.mins{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
.mins button{width:62px;height:48px;border-radius:14px;background:var(--card);font-weight:700;border:2px solid transparent;box-shadow:0 2px 8px rgba(60,40,10,.05)}
.mins button.sel{border-color:var(--accent);background:var(--accent-soft)}
.pick{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.pick button{flex:none;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.pick img{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block;border:3px solid transparent;margin-bottom:3px;background:#e7ddcb}
.pick button.sel{color:var(--accent)}.pick button.sel img{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:88%;text-align:center}
#gate{position:absolute;inset:0;z-index:60;background:rgba(20,16,10,.5);display:flex;align-items:flex-end}
.gatebox{position:relative;width:100%;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:26px 20px calc(22px + var(--safe-b))}
#gateX{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--card);font-size:15px;color:var(--muted)}
#gateBody h2{font-size:24px;margin-right:36px}
#gateBody p{color:var(--muted);margin:8px 0 0}
#gateBody input{display:block;width:100%;margin-top:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:inherit;color:var(--ink)}
#gateBody .err{color:#b42318;font-size:14px;min-height:20px;margin-top:8px}
#gateBody .lnk{display:block;width:100%;text-align:center;margin-top:14px;color:var(--teal);font-weight:700}
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.plan.best{border-color:var(--accent)}
.plan b{font-size:18px}.plan em{font-style:normal;float:right;font-weight:800;font-size:18px}
.plan span{display:block;color:var(--muted);font-size:14px;margin:4px 0 12px}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section class="view on" id="home">
    <div class="top">
      <div class="brand">Lingo<i>via</i></div>
      <span class="pair" id="pairTag">NL · FR</span>
      <span class="streak" id="streakTag">0 jour</span>
    </div>
    <div class="scroll" id="homeBody"></div>
  </section>

  <!-- REVIEW -->
  <section class="view" id="review">
    <div class="top"><div class="brand">Réviser</div><span class="pair" id="dueTag"></span></div>
    <div class="scroll" id="reviewBody"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="settings">
    <div class="top"><div class="brand">Réglages</div></div>
    <div class="scroll" id="settingsBody"></div>
  </section>

  <!-- ONBOARDING -->
  <section class="view" id="onb">
    <div class="obtop"><button id="obBack" aria-label="Retour">‹</button><div class="obbar" id="obBar"></div><button id="obSkip">Passer</button></div>
    <div class="scroll" id="obBody"></div>
    <div class="obfoot" id="obFoot"></div>
  </section>

  <!-- LESSON -->
  <section class="view" id="lesson">
    <div class="stage" id="stage">
      <img src="" alt="">
      <video id="vIdle" muted loop playsinline preload="auto"></video>
      <video id="vLive" muted loop playsinline preload="auto"></video>
      <canvas id="face" width="540" height="960"></canvas>
      <video id="vReact" muted playsinline preload="auto"></video>
      <video id="vSimli" playsinline autoplay></video><audio id="aSimli" autoplay></audio>
      <div id="av3d"></div>
      <div class="hud">
        <button class="pill" id="backBtn" aria-label="Retour">‹ Parcours</button>
        <span class="pill" id="dayPill" style="margin-left:auto"></span>
        <button class="pill" id="endBtn" hidden>Terminer</button>
        <button class="pill" id="helpBtn" hidden>Aide</button>
      </div>
      <div class="who"><b id="tutorName">Sanne</b><span><i class="dot"></i><em id="status" style="font-style:normal">À l'écoute</em><em id="timer" style="font-style:normal"></em><em id="liveTag" hidden style="font-style:normal;margin-left:6px;padding:1px 6px;border-radius:6px;background:#e5484d;color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em">LIVE</em></span></div>
      <div class="orb" id="orb"><i></i><b></b></div>
      <video class="pip" id="pip" playsinline muted hidden></video>
      <div class="lost" id="lost" hidden><div><b>Connexion perdue</b><p>L'appel a été coupé. Ta conversation est conservée.</p>
        <button class="btn block" id="resumeBtn">Reprendre l'appel</button><button class="btn block ghost" id="stopBtn" style="margin-top:8px">Terminer et voir le bilan</button></div></div>
      <div class="subs" id="subs"></div>
      <div class="cctl" id="cctl" hidden>
        <button class="cb" id="muteBtn" aria-label="Couper le micro"></button>
        <button class="cb" id="camBtn" aria-label="Caméra"></button>
        <button class="cb" id="spkBtn" aria-label="Haut-parleur"></button>
        <button class="cb" id="ccBtn" aria-label="Sous-titres"></button>
        <button class="cb hang" id="hangBtn" aria-label="Raccrocher"></button>
      </div>
    </div>
    <div class="sheet">
      <div id="chat"></div>
      <div id="sugg"></div>
      <div class="composer" id="composer" hidden>
        <button class="lang" id="langBtn" aria-label="Langue du micro">NL</button>
        <input id="txt" type="text" placeholder="Écris ou parle…" autocomplete="off" autocapitalize="sentences" enterkeyhint="send">
        <button class="mic" id="micBtn" aria-label="Parler"></button>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13M4 19a2 2 0 0 0 2 2h14M9 8h6M9 12h6"/></svg>Parcours</button>
    <button data-v="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>Réviser</button>
    <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Réglages</button>
  </nav>
  <div id="gate" hidden><div class="gatebox"><button id="gateX" aria-label="Fermer">✕</button><div id="gateBody"></div></div></div>
  <div id="toast"></div>
</div>

<script src="/config.js"></script>
<script src="/langs.js"></script>
<script src="/avatars.js"></script>
<script src="/onboarding.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  spk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  micOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9v2a3 3 0 0 0 5 2.2M15 9.5V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11.5 5.3M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-3v10l-5-3"/></svg>',
  camOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h4.500a2.500 2.500 0 0 1 2.500 2.500V12m0 4.500a2.500 2.500 0 0 1-2.500 1.500h-8A2.500 2.500 0 0 1 3 15.500v-7A2.500 2.500 0 0 1 4.300 6.300M16 10l5-3v10l-3-1.800M3 3l18 18"/></svg>',
  spkOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4zM16 9.500l5 5M21 9.500l-5 5"/></svg>',
  hang: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-3.2 0-6.2.9-8.6 2.500-.9.6-1.200 1.800-.800 2.800l.8 1.900c.3.8 1.200 1.200 2 .9l2.600-.9c.7-.2 1.200-.900 1.200-1.700v-1.300c1.800-.5 3.800-.5 5.600 0v1.300c0 .8.5 1.500 1.200 1.700l2.600.9c.8.3 1.700-.1 2-.9l.8-1.900c.4-1 .1-2.200-.8-2.800C18.200 9.900 15.200 9 12 9z"/></svg>',
};

/* ---------- state ---------- */
const KEY = 'lingovia.v1';
const DEF = { native: 'fr', target: 'nl', plans: {}, streak: 0, last: '', cards: [], set: { rate: 0.85, showTr: true, three: true, avatar: 'sanne', subs: 1, audioOnly: false } };
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); S.set = Object.assign({}, DEF.set, S.set); }
catch { S = structuredClone(DEF); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} if (typeof acct !== 'undefined') acct.queue(); };
const LANGS = window.LANGS, LEVELS = window.LEVELS;
// The current course: the language being learned and the learner's own language (names are given in the learner's language).
const C = () => { const t = LANGS[S.target] || LANGS.nl, n = LANGS[S.native] || LANGS.fr;
  return { target: { code: t.code, name: t.names[n.code], en: t.en, voice: [t.speech], flag: t.flag }, native: { code: n.code, name: n.names[n.code], en: n.en, voice: [n.speech], flag: n.flag }, tutor: AV().name }; };
const AV = () => window.AVATARS.find(a => a.id === S.set.avatar) || window.AVATARS[0];
const tutorVoice = () => (S.profile && S.profile.variant === 'be' && S.target === 'nl' && AV().voiceBE) || (AV().voices && AV().voices[S.target]) || AV().voice;
const today = () => new Date().toISOString().slice(0, 10);
/* ---------- study plan ----------
   No fixed calendar any more: each learner has a plan for their level, made of themes, each with a few lessons.
   The outline is written for them when they finish the questionnaire; a lesson's details are written when they open it. */
const levelIdx = () => Math.max(0, Math.min(LEVELS.length - 1, (S.profile && S.profile.level) || 0));
const PLAN = () => (S.plans || {})[S.target] || null;
const lessonsOf = pl => pl.themes.flatMap((t, ti) => t.lessons.map((l, li) => ({ t, l, ti, li })));
const doneCount = () => { const pl = PLAN(); return pl ? lessonsOf(pl).filter(x => x.l.done).length : 0; };
const nextLesson = () => { const pl = PLAN(); return pl ? lessonsOf(pl).find(x => !x.l.done) || null : null; };
function lessonInfo(ti, li) {
  const pl = PLAN(), t = pl.themes[ti], l = t.lessons[li];
  return { n: lessonsOf(pl).findIndex(x => x.ti === ti && x.li === li) + 1, ti, li, theme: t.title, title: l.title, focus: l.focus, intro: l.intro || '',
    scenario: l.scenario || `Play a short real-life scene about "${l.title}" (${l.focus}), within the theme "${t.title}".`, phrases: l.phrases || [], level: pl.level };
}
const freeInfo = () => ({ free: true, n: 0, title: 'Conversation libre', focus: 'Parle de ce que tu veux', intro: '', phrases: [], level: (PLAN() || {}).level || LEVELS[levelIdx()],
  scenario: 'Free conversation: no lesson today. Chat about whatever the learner wants (their day, their interests, their plans), at their level, and teach useful phrases as they come up.' });
const planBody = extra => { const p = S.profile || {}, o = OB(), pick = (list, ids) => list.filter(x => (ids || []).includes(x[0])).map(x => x[3]).join(', ');
  const goal = (o.goals.find(g => g.id === p.goal) || {}).en;
  return JSON.stringify({ native: S.native, target: S.target, level: LEVELS[levelIdx()], variant: p.variant, goal: [goal, pick(o.places[p.goal] || [], p.places)].filter(Boolean).join(': '),
    skills: pick(o.skills, p.skills), interests: pick(o.interests, p.interests), ...extra }); };
let planBusy = null;
function makePlan(avoid, past) {
  return planBusy || (planBusy = (async () => {
    try {
      const r = await fetch('/api/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: planBody({ do: 'outline', avoid: avoid || '' }) });
      if (!r.ok) throw new Error('plan');
      const d = await r.json();
      S.plans = S.plans || {};
      S.plans[S.target] = { level: LEVELS[levelIdx()], made: Date.now(), past: past || 0,
        themes: d.themes.map(t => ({ emoji: t.emoji, title: t.title, lessons: t.lessons.map(l => ({ title: l.title, focus: l.focus })) })) };
      save();
    } finally { planBusy = null; }
  })());
}
// Opens a lesson of the plan, writing its details first if this is the first time.
async function openAt(ti, li, trial) {
  const pl = PLAN(), l = pl && pl.themes[ti] && pl.themes[ti].lessons[li]; if (!l) return;
  if (!l.phrases) {
    toast('Préparation de la leçon…');
    try {
      const r = await fetch('/api/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: planBody({ do: 'lesson', theme: pl.themes[ti].title, title: l.title, focus: l.focus }) });
      if (r.ok) { const d = await r.json(); l.scenario = d.scenario; l.intro = d.intro; l.phrases = d.phrases; save(); }
    } catch {}
  }
  openLesson(lessonInfo(ti, li), trial);
}

/* ---------- account, minutes and subscription ----------
   Accounts are Supabase users (email and password). The browser only ever holds the learner's own session;
   minutes and subscriptions are checked on the server (api/account.js, api/session.js).
   Without a publishable key in config.js all of this stays off and the app works as before. */
const CFG = window.LINGOVIA || {};
const AUTHKEY = 'lingovia.auth';
const acct = {
  on: !!(CFG.supabaseUrl && CFG.supabaseKey), s: null, info: null, t: null,
  load() { try { this.s = JSON.parse(localStorage.getItem(AUTHKEY) || 'null'); } catch { this.s = null; } },
  keep(j) { this.s = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + ((j.expires_in || 3600) - 90) * 1000, email: j.user && j.user.email }; try { localStorage.setItem(AUTHKEY, JSON.stringify(this.s)); } catch {} },
  async auth(path, body) {
    const r = await fetch(`${CFG.supabaseUrl}/auth/v1/${path}`, { method: 'POST', headers: { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_code || j.msg || j.error_description || j.message || 'auth');
    return j;
  },
  async sign(email, password, isNew) {
    const j = await this.auth(isNew ? 'signup' : 'token?grant_type=password', { email, password });
    if (!j.access_token) throw new Error('confirm');          // the project asks to confirm the email first
    this.keep(j); await this.sync(isNew);
  },
  async token() {
    if (!this.on || !this.s) return null;
    if (Date.now() > this.s.exp) { try { this.keep(await this.auth('token?grant_type=refresh_token', { refresh_token: this.s.refresh })); } catch { this.out(); return null; } }
    return this.s.access;
  },
  async api(q = '', opt = {}) {
    const t = await this.token();
    return fetch('/api/account' + q, { method: opt.method || 'GET', headers: { 'Content-Type': 'application/json', ...(t ? { Authorization: 'Bearer ' + t } : {}) }, body: opt.body ? JSON.stringify(opt.body) : undefined });
  },
  async refresh() { if (!this.on || !this.s) return null; try { const r = await this.api(); if (r.ok) this.info = await r.json(); else if (r.status === 401) this.out(); } catch {} return this.info; },
  // After signing in: take the progress saved on the account if it is further along than this device's, otherwise save this device's.
  async sync(isNew) {
    const i = await this.refresh(); if (!i) return;
    const far = st => st && st.profile && st.profile.done ? 1 + Object.values(st.plans || {}).reduce((a, pl) => a + (pl.past || 0) + pl.themes.reduce((b, t) => b + t.lessons.filter(l => l.done).length, 0), 0) : 0;
    if (!isNew && far(i.state) > far(S)) { S = Object.assign({}, DEF, i.state); S.set = Object.assign({}, DEF.set, S.set); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
    else this.push();
  },
  queue() { if (!this.on || !this.s) return; clearTimeout(this.t); this.t = setTimeout(() => this.push(), 4000); },
  push() { clearTimeout(this.t); if (this.on && this.s) this.api('', { method: 'PUT', body: { state: S } }).catch(() => {}); },
  out() { this.s = null; this.info = null; try { localStorage.removeItem(AUTHKEY); } catch {} },
  left() { return this.info ? Math.floor(this.info.leftSeconds / 60) : null },
};
acct.load();
const PLAN_NAMES = { free: 'Découverte', essentiel: 'Essentiel', intensif: 'Intensif' };

// A finished level leads to the next one, with new themes. Progress already made is kept in the count.
function levelUp(to) {
  const old = PLAN(), avoid = old ? old.themes.map(t => t.title).join(', ') : '';
  S.profile = S.profile || {}; S.profile.level = to != null ? to : Math.min(LEVELS.length - 1, levelIdx() + 1);
  const past = old ? (old.past || 0) + lessonsOf(old).filter(x => x.l.done).length : 0;
  delete S.plans[S.target]; save();
  makePlan(avoid, past).then(renderHome).catch(() => {});   // started before the home screen asks for a plan of its own
  renderHome();
}

/* ---------- speech out ---------- */
const synth = window.speechSynthesis;
let voices = [];
const loadVoices = () => { if (synth) voices = synth.getVoices(); };
loadVoices(); if (synth) synth.onvoiceschanged = loadVoices;
const NICE = /ellen|claire|fenna|colette|lotte|xander|amelie|amélie|audrey|marie|aurelie|aurélie|google|natural|enhanced|premium/i;
function voiceFor(which) {
  const prefs = C()[which].voice, code = C()[which].code;
  const pool = voices.filter(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith(code));
  if (!pool.length) return null;
  pool.sort((a, b) => (NICE.test(b.name) - NICE.test(a.name)) || (prefs.indexOf(a.lang) < 0 ? 9 : prefs.indexOf(a.lang)) - (prefs.indexOf(b.lang) < 0 ? 9 : prefs.indexOf(b.lang)));
  return pool[0];
}
let speakRun = 0, elOK = null, stopClip = null;
const player = new Audio(), clips = new Map();
// a few silent samples, played inside a tap so iOS lets later audio through
const SILENCE = URL.createObjectURL(new Blob([Uint8Array.from(atob('UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQQAAAAAAAAA'), c => c.charCodeAt(0))], { type: 'audio/wav' }));
let actx = null, analyser = null, abuf = null;
function unlockAudio() {
  try { player.src = SILENCE; player.play().catch(() => {}); } catch {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !actx) { actx = new AC(); analyser = actx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.35; abuf = new Uint8Array(analyser.fftSize);
      actx.createMediaElementSource(player).connect(analyser); analyser.connect(actx.destination); face.attach(analyser); }
    if (actx && actx.state !== 'running') actx.resume().catch(() => {});
  } catch {}
  if (synth) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch {} }
}
async function clip(text, speed) {
  const voice = tutorVoice(), k = voice + '|' + speed + '|' + text;
  if (clips.has(k)) return clips.get(k);
  if (elOK === false) return null;
  try {
    const r = await fetch('/api/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, speed, voice }) });
    if (!r.ok) { if (r.status !== 429 && r.status < 500 || r.status === 501 || r.status === 503) elOK = false; return null; }
    elOK = true;
    const url = URL.createObjectURL(await r.blob());
    clips.set(k, url); return url;
  } catch { return null; }
}
const playClip = url => new Promise(res => {
  const end = () => { player.onended = player.onerror = null; stopClip = null; res(); };
  stopClip = () => { player.pause(); end(); };
  player.onended = player.onerror = end; player.src = url; player.play().catch(end);
});
const synthSay = (it, slow) => new Promise(res => {
  if (!synth) return res();
  const u = new SpeechSynthesisUtterance(it.text), v = voiceFor(it.lang);
  if (v) u.voice = v;
  u.lang = v ? v.lang : C()[it.lang].voice[0];
  u.rate = it.lang === 'target' ? (slow ? 0.6 : S.set.rate) : 1;
  let fired = false;
  const go = () => { if (!fired) { fired = true; clearTimeout(guard); res(); } };
  // some browsers never fire onend; fall back to an estimate
  const guard = setTimeout(go, 1500 + it.text.length * 110 / u.rate);
  u.onend = go; u.onerror = go; synth.speak(u);
});
function setTalking(on) { $('#stage').classList.toggle('talking', on); if (on) $('#status').textContent = 'Parle'; else if (!$('#stage').classList.contains('thinking')) $('#status').textContent = 'À l\'écoute'; }
function stopSpeaking() { speakRun++; if (stopClip) stopClip(); if (synth) synth.cancel(); if (!(L && L.conv)) setTalking(false); }
// items: [{lang:'target'|'native', text}], spoken one after the other
async function speak(items, slow) {
  stopSpeaking();
  if (!items.length || (L && L.conv)) return;
  const run = ++speakRun;
  stopListening();
  if (analyser) face.attach(analyser);
  for (const it of items) {
    const speed = it.lang === 'target' ? (slow ? 0.75 : Math.min(1.2, Math.max(0.7, S.set.rate + 0.1))) : 1;
    const url = await clip(it.text, speed);
    if (run !== speakRun) return;
    setTalking(true); face.fake = !url;
    await (url ? playClip(url) : synthSay(it, slow));
    face.fake = false;
    if (run !== speakRun) return;
  }
  setTalking(false);
}

/* ---------- 3D avatar (TalkingHead, MIT) ---------- */
const av3d = (() => {
  let head = null, booting = null, shown = null, lastEnd = 0, token = 0, THREE = null;
  const hair = { on: false, u: null, bone: null, p: null, v: null, x: null, tmp: null, t: 0 };
  const REACT = { smile: '😊', laugh: '😄', surprised: '😳', thinking: '🤔', wink: '😉', nod: 'yes', shake_head: 'no', wave: '👋',
    thumbs_up: '👍', ok: '👌', shrug: '🤷', proud: '🥰', oops: '😬' };
  const on = () => !!head && $('#stage').classList.contains('three');
  function boot() {
    return booting || (booting = (async () => {
      const { TalkingHead } = await import('/vendor/talkinghead/talkinghead.mjs');
      THREE = await import('three');
      head = new TalkingHead($('#av3d'), { update: dt => hairTick(dt), ttsEndpoint: null, lipsyncModules: [], cameraView: 'head', cameraDistance: 0.4, cameraY: 0.09,
        cameraRotateEnable: false, modelFPS: 30, modelPixelRatio: Math.min(2, window.devicePixelRatio || 1),
        avatarIdleEyeContact: 0.6, avatarSpeakingEyeContact: 0.8, avatarSpeakingHeadMove: 0.6, lightAmbientIntensity: 2, lightDirectIntensity: 20 });
      return true;
    })().catch(() => { booting = null; head = null; return false; }));
  }
  async function show() {
    const a = AV(), my = ++token;
    if (!a.video) { $('#stage').classList.add('nophoto'); $('#stage').querySelector(':scope > img').src = a.thumb; }
    if (a.video) return hide();          // video tutors are drawn by the face renderer
    if (!S.set.three) return hide();
    if (!(await boot()) || my !== token) return;
    if (shown !== a.id) {
      $('#stage').classList.remove('three');
      try { await head.showAvatar({ url: a.model, lipsyncLang: 'en', ...a.opts }); shown = a.id; hairSetup(a); dress(a); }
      catch { shown = null; return; }
      if (my !== token) return;
    }
    try { head.start(); } catch {}
    $('#stage').classList.add('three'); view($('#lesson').classList.contains('call'));
  }
  /* Hair: the models have no hair bones, so the strands are moved in the shader. The further a strand hangs
     below the top of the head, the more it lags behind the head's movement, on a small damped spring. */
  function dress(a) {
    try { for (const [pat, col] of a.tint || []) head.armature.traverse(o => { if (o.isMesh && o.name.toLowerCase().includes(pat.toLowerCase())) {
      o.material = Array.isArray(o.material) ? o.material.map(m => m.clone()) : o.material.clone();
      for (const m of [].concat(o.material)) m.color.set(col); } }); } catch {}
  }
  function hairSetup(a) {
    hair.on = false; const grey = !!(a && a.greyHair);
    try {
      const meshes = []; hair.bone = null;
      head.armature.traverse(o => { if (o.isBone && o.name === 'Head') hair.bone = o; if (o.isMesh && /hair/i.test(o.name)) meshes.push(o); });
      if (!meshes.length || !hair.bone) return;
      hair.u = { uSway: { value: new THREE.Vector3() }, uTopY: { value: 10 } };
      hair.p = null; hair.v = new THREE.Vector3(); hair.x = new THREE.Vector3(); hair.tmp = new THREE.Vector3();
      for (const m of meshes) for (const mat of (Array.isArray(m.material) ? m.material : [m.material])) {
        mat.onBeforeCompile = sh => {
          Object.assign(sh.uniforms, hair.u);
          sh.vertexShader = 'uniform vec3 uSway;\nuniform float uTopY;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
            vec4 hwp = modelMatrix * vec4( transformed, 1.0 );
            float hw = clamp( ( uTopY - hwp.y ) / 0.32, 0.0, 1.0 ); hw *= hw;
            mvPosition += viewMatrix * vec4( uSway * hw, 0.0 );
            gl_Position = projectionMatrix * mvPosition;`);
          if (grey) sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
            float hg = dot( diffuseColor.rgb, vec3( 0.3, 0.59, 0.11 ) );
            diffuseColor.rgb = mix( diffuseColor.rgb, vec3( hg ) * 2.1 + 0.08, 0.92 );`);
        };
        mat.needsUpdate = true;
      }
      hair.on = true;
    } catch { hair.on = false; }
  }
  function hairTick(dt) {
    if (!hair.on || !dt) return;
    const h = hair, s = Math.min(0.05, dt / 1000); h.t += s;
    h.bone.getWorldPosition(h.tmp);
    h.u.uTopY.value = h.tmp.y + 0.04;                       // strands start moving a little below the crown
    const f = new THREE.Vector3(0, 0, 0.12).applyQuaternion(h.bone.getWorldQuaternion(new THREE.Quaternion())).add(h.tmp); // a point in front of the face
    if (!h.p) { h.p = f.clone(); return; }
    const vel = f.clone().sub(h.p).divideScalar(s); h.p.copy(f);
    const target = vel.multiplyScalar(-0.05); target.y *= 0.3; target.clampLength(0, 0.035);
    target.x += Math.sin(h.t * 1.3) * 0.0015; target.z += Math.sin(h.t * 0.9 + 1) * 0.001;   // a hint of air
    // damped spring towards the target
    h.v.add(target.sub(h.x).multiplyScalar(90 * s)).multiplyScalar(Math.max(0, 1 - 9 * s));
    h.x.add(h.v.clone().multiplyScalar(s));
    h.u.uSway.value.copy(h.x);
  }
  function hide() { token++; $('#stage').classList.remove('three'); if (head) { try { head.stop(); } catch {} } }
  // call: waist-up so the hands are visible. lesson card: face only.
  function view(call) { if (!head) return; try { head.setView(call ? 'upper' : 'head', call ? { cameraDistance: 0.2, cameraY: 0.06 } : { cameraDistance: 0.4, cameraY: 0.09 }); } catch {} }
  function set(k, v) { if (!on()) return; const m = head.mtAvatar && head.mtAvatar[k]; if (m) { m.newvalue = v; m.needsUpdate = true; } }
  // a new sentence: look at the learner and gesture, like a person starting to talk
  function sentence() { if (!on()) return; if (Date.now() - lastEnd > 400) { try { head.lookAtCamera(600); head.speakWithHands(); } catch {} } }
  function ended() { lastEnd = Date.now(); }
  // facial expression or gesture, by name (see REACT)
  function react(name, dur) {
    if (!on()) return;
    let g = REACT[name]; if (!g) return;
    if (name === 'shrug') g = AV().gender === 'M' ? '🤷‍♂️' : '🤷‍♀️';
    try { head.playGesture(g, dur || 3); } catch {}
  }
  function mood(m) { if (!on()) return; try { head.setMood(m || AV().mood || 'neutral'); } catch {} }
  function look() { if (on()) { try { head.lookAtCamera(1200); } catch {} } }
  return { show, hide, view, set, sentence, ended, react, mood, look, on, hair, reactions: Object.keys(REACT), get head() { return head; },
    peek: k => head && head.mtAvatar && head.mtAvatar[k] ? head.mtAvatar[k].value : null };
})();

  if (h) h.remove();

}

async function turn(text, isStart) {
  L.busy = true; $('#sugg').innerHTML = '';
  $('#stage').classList.add('thinking'); $('#status').textContent = 'Réfléchit';
  const dots = add('<div class="typing"><i></i><i></i><i></i></div>', 'msg her');
  L.history.push({ role: 'user', content: text });
  const mine = L;
  let r = null;
  if (L.mode === 'ai') {
    try { r = await askTutor(); }
    catch (e) {
      if (isStart || e.fatal) { L.mode = 'script'; add('Mode entraînement guidé. La conversation libre s\'active quand la clé du tuteur est configurée.', 'note'); }
      else { dots.remove(); L.history.pop(); L.busy = false; $('#stage').classList.remove('thinking'); $('#status').textContent = 'À l\'écoute'; return toast('Connexion perdue. Réessaie.'); }
    }
  }
  if (L !== mine) return;
  if (!r) { await new Promise(z => setTimeout(z, 450)); r = scriptReply(text, isStart); }
  dots.remove();
  $('#stage').classList.remove('thinking');
  if (L !== mine) return;
  render(r);
  L.history.push({ role: 'assistant', content: r.segments.map(s => s.text).join(' ') });
  L.busy = false;
  await speak(r.segments.map(s => ({ lang: s.lang, text: s.text })));
}

async function askTutor() {
  const c = C(), i = L.info;
  let res;
  try {
    res = await fetch('/api/tutor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      day: i.n, tutor: c.tutor, targetName: c.target.en, nativeName: c.native.en, level: i.level,
      title: i.title, focus: i.focus, scenario: i.scenario, phrases: i.phrases, history: L.history }) });
  } catch { throw Object.assign(new Error('offline'), { fatal: false }); }
  if (!res.ok) throw Object.assign(new Error('tutor'), { fatal: res.status === 503 || res.status === 404 || res.status === 405 });
  const d = await res.json();
  if (!d || !Array.isArray(d.segments) || !d.segments.length) throw new Error('bad');
  return d;
}

/* guided mode, used when the AI tutor is not reachable */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function sim(a, b) {
  a = norm(a); b = norm(b); if (!a || !b) return 0; if (a === b) return 1;
  const m = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return 1 - m[a.length][b.length] / Math.max(a.length, b.length);
}
function scriptReply(text, isStart) {
  const p = L.info.phrases, n = p.length, segs = [];
  const r = { segments: segs, correction: { needed: false, original: '', corrected: '', explanation: '' }, suggestions: [], new_phrases: [], lesson_complete: false };
  if (isStart) segs.push({ lang: 'native', text: `Bonjour, je suis ${AV().name}. Aujourd'hui: ${L.info.title.toLowerCase()}. ${L.info.scenario}`, translation: '' });
  else if (L.expect) {
    if (sim(text, L.expect.target) >= 0.72) segs.push({ lang: 'native', text: ['Très bien !', 'Parfait !', 'Oui, c\'est ça !', 'Bravo !'][L.step % 4], translation: '' });
    else { r.correction = { needed: true, original: text, corrected: L.expect.target, explanation: `En français: ${L.expect.native}` }; segs.push({ lang: 'native', text: 'Presque. Écoute encore une fois.', translation: '' }, { lang: 'target', text: L.expect.target, translation: L.expect.native }); }
  }
  const k = L.step++;
  if (k < n) { // listen and repeat
    L.expect = p[k];
    segs.push({ lang: 'native', text: k ? 'Répète:' : 'Répète après moi:', translation: '' }, { lang: 'target', text: p[k].target, translation: p[k].native });
    r.new_phrases.push(p[k]);
  } else if (k < 2 * n) { // translate back, in a different order
    const q = p[(k - n + 1) % n]; L.expect = q;
    segs.push({ lang: 'native', text: `Maintenant sans aide. Comment dis-tu: ${q.native}`, translation: '' });
  } else {
    L.expect = null; r.lesson_complete = true;
    segs.push({ lang: 'native', text: 'Tu connais les phrases du jour.', translation: '' }, { lang: 'target', text: 'Goed gedaan! Tot morgen!', translation: 'Bien joué ! À demain !' });
  }
  if (L.expect) r.suggestions = [L.expect];
  return r;
}

function render(r) {
  const c = r.correction;
  if (c && c.needed && c.corrected) add(`<h4>Petite correction</h4><s>${esc(c.original)}</s>
    <div class="good" data-t="${esc(c.corrected)}">${esc(c.corrected)}</div><p>${esc(c.explanation)}</p>`, 'fix');
  add(r.segments.map(s => s.lang === 'target'
    ? `<div class="seg t" data-t="${esc(s.text)}"><div class="tx">${esc(s.text)}</div>${s.translation ? `<div class="tr${S.set.showTr ? '' : ' hid'}">${esc(s.translation)}</div>` : ''}
       <div class="act"><span class="chip">${ICON.spk}Écouter</span><span class="chip" data-slow="1">Lent</span></div></div>`
    : `<div class="seg">${esc(s.text)}</div>`).join(''), 'msg her');
  for (const p of r.new_phrases || []) if (p.target && !L.learned.some(x => x.target === p.target)) L.learned.push(p);
  $('#sugg').innerHTML = (r.suggestions || []).slice(0, 3).map(s => `<button data-t="${esc(s.target)}"><b>${esc(s.target)}</b><span>${esc(s.native)}</span></button>`).join('');
  if (r.lesson_complete && !L.complete) {
    L.complete = true; $('#sugg').innerHTML = ''; $('#composer').hidden = true;
    add(`<h3>Leçon terminée</h3><p class="sub">Bravo. Tes phrases sont ajoutées à tes révisions.</p><button class="btn block teal" id="doneBtn">Valider le jour ${L.info.n}</button>`, 'card');
  }
}

function finish() {
  if (!L) return;
  const i = L.info, pl = PLAN(), les = !i.free && pl && pl.themes[i.ti] && pl.themes[i.ti].lessons[i.li], first = !!les && !les.done;
  if (les) les.done = true;
  const t = today();
  if (S.last !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak = S.last === y ? S.streak + 1 : 1; S.last = t;
  }
  for (const p of [...L.info.phrases, ...L.learned])
    if (p.target && p.native && !S.cards.some(c => c.t === p.target)) S.cards.push({ t: p.target, n: p.native, box: 0, due: Date.now() });

      <p class="lead" style="margin-bottom:10px">Pour que ton prof accorde bien ses phrases :</p>
      <div class="opts">${optRow('m', '👨', 'Homme', '', p.gender === 'm')}${optRow('f', '👩', 'Femme', '', p.gender === 'f')}${optRow('x', '🤔', 'Je préfère ne pas le dire', '', p.gender === 'x')}</div>`;
    foot.innerHTML = next('Continuer', !!(p.name && p.gender));
  } else if (step === 'goal') {
    body.innerHTML = `<h1>Pourquoi veux-tu apprendre cette langue ?</h1><p class="lead"></p><div class="opts">${o.goals.map(g => optRow(g.id, g.e, g.t, '', p.goal === g.id)).join('')}</div>`;
  } else if (step === 'places') {
    body.innerHTML = `<h1>Où vas-tu t'en servir ?</h1><p class="lead">Choisis tout ce qui te concerne.</p><div class="opts">${(o.places[p.goal] || o.places.fun).map(x => optRow(x[0], x[1], x[2], '', (p.places || []).includes(x[0]))).join('')}</div>`;
    foot.innerHTML = next('Continuer', (p.places || []).length > 0);
  } else if (step === 'variant') {
    body.innerHTML = `<h1>Quel néerlandais veux-tu parler ?</h1><p class="lead">Le vocabulaire et l'accent de ton prof s'adaptent.</p><div class="opts">${o.variants.map(v => optRow(v.id, v.e, v.t, v.s, p.variant === v.id)).join('')}</div>`;
  } else if (step === 'skills') {
    body.innerHTML = `<h1>Que veux-tu améliorer en priorité ?</h1><p class="lead">Choisis une ou plusieurs réponses.</p><div class="opts">${o.skills.map(x => optRow(x[0], x[1], x[2], '', (p.skills || []).includes(x[0]))).join('')}</div>`;
    foot.innerHTML = next('Continuer', (p.skills || []).length > 0);
  } else if (step === 'interests') {
    body.innerHTML = `<h1>De quoi aimes-tu parler ?</h1><p class="lead">Ton prof choisira ses sujets de conversation là-dedans.</p><div class="chips">${o.interests.map(x => `<button class="wchip ${(p.interests || []).includes(x[0]) ? 'sel' : ''}" data-int="${x[0]}">${x[1]} ${esc(x[2])}</button>`).join('')}</div>`;
    foot.innerHTML = next('Continuer', (p.interests || []).length > 0);
  } else if (step === 'correct') {
    body.innerHTML = `<h1>À quel point veux-tu qu'on te corrige ?</h1><p class="lead"></p><div class="opts">${optRow('key', '🎯', 'Seulement les fautes importantes', 'Pour parler sans s\'arrêter', p.correct === 'key')}${optRow('flow', '🌊', 'Au fur et à mesure', 'Ton prof reformule en douceur', p.correct === 'flow')}${optRow('all', '🔍', 'Corrige tout', 'Chaque faute, tout de suite', p.correct === 'all')}</div>`;
  } else if (step === 'style') {
    const st = [['warm', '👋', 'Sympa et chaleureux'], ['calm', '🍃', 'Calme et doux'], ['cool', '😎', 'Cool et moderne'], ['fun', '🤪', 'Enjoué et amusant'], ['classic', '🎓', 'Classique et méthodique']];
    body.innerHTML = `<h1>Quel style de prof te plairait le plus ?</h1><p class="lead"></p><div class="opts">${st.map(x => optRow(x[0], x[1], x[2], '', p.style === x[0])).join('')}</div>`;
  } else if (step === 'match') {
    if (ob.picking) {
      body.innerHTML = `<h1>Choisis ton prof</h1><p class="lead">Tu pourras en changer à tout moment.</p><div class="opts" style="max-width:400px">${window.AVATARS.map(a => `<div class="trow ${a.id === AV().id ? 'sel' : ''}" data-pick="${a.id}"><img src="${a.thumb}" alt=""><div style="flex:1;min-width:0"><b>${esc(a.name)}</b><small>${esc(a.bio)}</small>${tagsOf(a)}</div><button class="play" data-play="${a.id}">${ICON.spk}</button></div>`).join('')}</div>`;
      foot.innerHTML = next(`Continuer avec ${esc(AV().name)}`);
    } else {
      const a = AV();
      body.innerHTML = `<h1>On a trouvé ton prof</h1><p class="lead">D'après tes réponses, ${esc(a.name)} te correspond le mieux.</p>
        <div class="tcardb"><img src="${a.thumb}" alt="${esc(a.name)}"><div class="inf"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(a.name)}</h3><button class="play" data-play="${a.id}">${ICON.spk} Écouter</button></div><p>${esc(a.bio)}</p>${tagsOf(a)}</div></div>`;
      foot.innerHTML = next(`Continuer avec ${esc(a.name)}`) + `<button class="btn ghost" id="obOther">Choisir un autre prof</button>`;
    }
  } else if (step === 'ready') {
    const goal = o.goals.find(g => g.id === p.goal), a = AV(), pl = PLAN(); p.minutes = p.minutes || 10;
    if (!pl && !ob.making && !ob.failed) { ob.making = true; makePlan().then(() => { if (ob) { ob.making = false; renderOnb(); } }).catch(() => { if (ob) { ob.making = false; ob.failed = true; renderOnb(); } }); }
    body.innerHTML = `<h1>${pl ? 'Ton programme est prêt' : 'On prépare ton programme'}${p.name ? ', ' + esc(p.name) : ''}</h1><p class="lead">${pl ? 'Voici ce qu\'on a préparé pour toi.' : 'Des thèmes choisis pour ton niveau et tes objectifs. Quelques secondes…'}</p>
      <div class="sum"><div><span>Langue</span><b>${C().target.flag} ${esc(C().target.name)}</b></div><div><span>Niveau de départ</span><b>${LEVELS[levelIdx()]}</b></div>
        <div><span>Objectif</span><b>${esc(goal ? goal.t : '')}</b></div><div><span>Corrections</span><b>${{ key: 'Fautes importantes', all: 'Tout corriger' }[p.correct] || 'Au fur et à mesure'}</b></div>
        <div><span>Ton prof</span><b>${esc(a.name)}</b></div></div>
      ${pl ? `<p class="lead" style="margin:18px 0 8px">Tes premiers thèmes</p><div class="chips">${pl.themes.slice(0, 6).map(t => `<span class="wchip" style="cursor:default">${esc(t.emoji || '')} ${esc(t.title)}</span>`).join('')}</div>`
        : ob.failed ? '<p class="lead" style="margin-top:18px">Le programme n\'a pas pu être préparé. Vérifie ta connexion.</p>' : '<div class="typing" style="margin-top:22px"><i></i><i></i><i></i></div>'}
      <p class="lead" style="margin:18px 0 0">Combien de temps par jour ?</p>
      <div class="mins">${[5, 10, 15, 20].map(m => `<button data-min="${m}" class="${p.minutes === m ? 'sel' : ''}">${m} min</button>`).join('')}</div>`;
    foot.innerHTML = ob.failed ? `<button class="btn" id="obRetry">Réessayer</button><button class="btn ghost" id="obLater">Plus tard</button>`
      : `<button class="btn" id="obTrial" ${pl ? '' : 'disabled'}>Faire mon premier appel (2 min)</button><button class="btn ghost" id="obLater">Plus tard</button>`;
  }
}
function obFinish(trial) {
  const p = S.profile; p.done = true; p.step = 0; save(); ob = null;
  if (trial && PLAN()) openAt(0, 0, true).then(() => { $('#startBtn')?.remove(); begin(); });
  else { show('home'); if (PLAN()) toast('Ton programme est prêt'); }
}
$('#obBack').addEventListener('click', () => { if (!ob) return; if (ob.picking) { ob.picking = false; return renderOnb(); } obGo(-1); });
$('#obSkip').addEventListener('click', () => { if (!ob) return; if (S.profile.done !== true) S.profile.done = 'skipped'; save(); ob = null; show('home'); });
$('#onb').addEventListener('input', e => { if (e.target.id === 'obName') { S.profile.name = e.target.value.trim(); const b = $('#obNext'); if (b) b.disabled = !(S.profile.name && S.profile.gender); } });
$('#onb').addEventListener('click', e => {
  if (!ob) return;
  const p = S.profile, o = OB(), step = STEPS[ob.i];
  const pl = e.target.closest('[data-play]');
  if (pl) { e.stopPropagation(); const a = window.AVATARS.find(x => x.id === pl.dataset.play); unlockAudio(); stopSpeaking(); player.src = a.sample; return void player.play().catch(() => {}); }
  const pk = e.target.closest('[data-pick]'); if (pk) { S.set.avatar = pk.dataset.pick; save(); return renderOnb(); }
  const it = e.target.closest('[data-int]'); if (it) { const a = new Set(p.interests || []); a.has(it.dataset.int) ? a.delete(it.dataset.int) : a.add(it.dataset.int); p.interests = [...a]; save(); return renderOnb(); }
  const mn = e.target.closest('[data-min]'); if (mn) { p.minutes = +mn.dataset.min; save(); return renderOnb(); }
  if (e.target.closest('#obOther')) { ob.picking = true; return renderOnb(); }
  if (e.target.closest('#obRetry')) { ob.failed = false; return renderOnb(); }
  if (e.target.closest('#obTrial')) return obFinish(true);
  if (e.target.closest('#obLater')) return obFinish(false);
  const opt = e.target.closest('[data-o]');
  if (opt) {
    const v = opt.dataset.o;
    if (step === 'name') { p.gender = v; save(); return renderOnb(); }
    if (step === 'places' || step === 'skills') { const k = step, a = new Set(p[k] || []); a.has(v) ? a.delete(v) : a.add(v); p[k] = [...a]; save(); return renderOnb(); }
    if (step === 'native') { S.native = v; ob.nat = true; if (S.target === v) S.target = v === 'nl' ? 'fr' : 'nl'; }
    else if (step === 'target') { S.target = v; ob.tgt = true; }
    else if (step === 'level') { if (p.level !== +v && PLAN() && PLAN().level !== LEVELS[+v]) delete S.plans[S.target]; p.level = +v; }
    else if (step === 'goal') { if (p.goal !== v) p.places = []; p.goal = v; }
    else if (step === 'variant') p.variant = v;
    else if (step === 'correct') p.correct = v;
    else if (step === 'style') { p.style = v; const a = window.AVATARS.find(x => x.style === v); if (a) S.set.avatar = a.id; }
    save(); opt.classList.add('sel');
    return void setTimeout(() => { if (ob && STEPS[ob.i] === step) obGo(1); }, 180);
  }
  if (e.target.closest('#obNext')) {
    if (step === 'name' && !(p.name && p.gender)) return;
    obGo(1);
  }
});

/* ---------- boot ---------- */
if (!LANGS[S.native]) S.native = 'fr'; if (!LANGS[S.target] || S.target === S.native) S.target = S.native === 'nl' ? 'fr' : 'nl';
S.plans = S.plans || {}; delete S.done; delete S.start; delete S.pair;
if (!S.profile || !S.profile.done) startOnb(); else renderHome();
// arriving from the "forgot password" email: the link carries a short session, used to set the new password
{ const h = new URLSearchParams(location.hash.slice(1));
  if (acct.on && h.get('type') === 'recovery' && h.get('access_token')) { acct.keep({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: +h.get('expires_in') || 3600 }); history.replaceState(null, '', '/app'); gate('newpass'); }
  else if (acct.on && h.get('error_description')) { history.replaceState(null, '', '/app'); gate('forgot'); setTimeout(() => { const e = $('#authErr'); if (e) e.textContent = 'Ce lien a expiré. Demande-en un nouveau.'; }, 0); } }
if (acct.on && acct.s) acct.refresh().then(() => { const q = new URLSearchParams(location.search).get('paid'); if (q === '1') toast('Merci ! Ton offre est active.'); if (q) history.replaceState(null, '', '/app'); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
window.__lingovia = { get S() { return S; }, get L() { return L; }, face, av3d };
})();
